[pytest]
testpaths = tests
addopts =
    --tb=short
    --strict-markers
    -v
    --cov=pkcs11_app
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml
    --cov-fail-under=85
timeout = 60
markers =
    unit: pure unit tests — no HSM required
    integration: tests requiring a live SoftHSM2 token
    load: throughput and latency benchmarks
    perf: comprehensive per-mechanism performance benchmarks
