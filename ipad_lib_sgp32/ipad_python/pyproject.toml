[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ipad-sgp32"
version = "1.0.0"
description = "GSMA SGP.32 IPAd library — Python port"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev    = ["pytest>=7", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"
